<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ao — Zellij Theme Gallery</title>
<meta property="og:title" content="zellij theme: ao">
<meta property="og:description" content="Screenshot and setup command for the ao zellij theme">
<meta property="og:image" content="https://rodbv.github.io/zellij-theme-gallery/images/ao.png">
<link rel="stylesheet" href="../style.css?v=76b7c9fc">
<link rel="prefetch" href="../images/ansi.png">
<link rel="prefetch" href="../images/atelier.png">

<script>function copyCmd(btn) {
  const code = btn.parentElement.querySelector('code').textContent;
  navigator.clipboard.writeText(code).then(() => {
    const old = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = old; }, 1200);
  });
}
</script>
</head>
<body>
<header class="detail-header">
  <div>
    <a class="back" href="../index.html">&larr; all themes</a>
    <h1><code>ao</code></h1>
  </div>
  <a class="cta" href="#use">Use this theme</a>
</header>
<main>
  <nav class="pager">
    <span><a href="ansi.html">&larr; ansi</a></span>
    <span><a href="atelier.html">atelier &rarr;</a></span>
  </nav>
  <a class="detail-img-link" href="../images/ao.png" target="_blank" rel="noopener">
    <img class="detail-img" src="../images/ao.png" alt="zellij ao theme"
         width="2400" height="1485" style="view-transition-name: theme-ao">
  </a>
  <p class="full-hint">Click image for full resolution</p>

  <section id="use">
    <div class="cmd-block">
      <h2>Set permanently — add to <code>~/.config/zellij/config.kdl</code></h2>
      <div class="cmd">
        <code>theme "ao"</code>
        <button onclick="copyCmd(this)">Copy</button>
      </div>
    </div>

    <div class="cmd-block">
      <h2>Try it — start a new session with this theme</h2>
      <div class="cmd">
        <code>zellij options --theme ao</code>
        <button onclick="copyCmd(this)">Copy</button>
      </div>
    </div>
  </section>
</main>
<footer>
  Screenshots generated headlessly with
  <a href="https://github.com/rodbv/zellij-theme-gallery">theme_gallery.py</a>
  &middot; <a href="https://zellij.dev/documentation/themes">zellij themes docs</a>
</footer>

<script>
const PREV = "ansi.html";
const NEXT = "atelier.html";
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea')) return;
  if (e.key === 'ArrowLeft' && PREV) location.href = PREV;
  else if (e.key === 'ArrowRight' && NEXT) location.href = NEXT;
  else if (e.key === 'Escape') location.href = '../index.html';
});

</script>
</body>
</html>
